<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrowserStack raw-audio debug</title>
  </head>
  <body>
    <button id="play">play</button>
    <audio id="audio" src="/mp3/short-continuous-1.mp3" preload="auto"></audio>
    <script>
      // First-principles probe: no stitches. Just a bare <audio> and a
      // synchronous play() inside the click handler. Records the element's own
      // events (and any play() promise rejection) so we can see exactly what a
      // real device does with plain HTML5 audio under automation.
      window.__diag = []
      const audio = document.getElementById("audio")
      const log = (t, extra) =>
        window.__diag.push({
          t,
          ct: audio.currentTime,
          ready: audio.readyState,
          ...extra,
        })
      ;[
        "loadedmetadata",
        "canplay",
        "canplaythrough",
        "play",
        "playing",
        "timeupdate",
        "waiting",
        "stalled",
        "suspend",
        "error",
      ].forEach((ev) => audio.addEventListener(ev, () => log(ev)))

      document.getElementById("play").addEventListener("click", () => {
        log("click")
        const p = audio.play()
        if (p && p.catch)
          p.catch((e) => log("play-rejected", { name: e.name, msg: e.message }))
      })
    </script>
  </body>
</html>
