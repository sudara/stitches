name: BrowserStack

# Opt-in real-device lane. Local Playwright already covers the Chromium,
# Firefox and WebKit (Safari) engines; this exists only for real iOS/Android
# devices, driven by Selenium + Appium (nativeWebTap) so iOS Safari grants the
# media user-activation Playwright can't. Triggered manually.
on: workflow_dispatch

jobs:
  browserstack:
    name: BrowserStack (real devices)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the real devices fetch the fixtures + MP3s over the BrowserStack Local
      # tunnel (opened by the runner) from this server
      - name: Serve the site
        run: npx http-server -p 8080 -s &
      - name: Wait for the server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/tests/fixtures/player-queue.html && exit 0
            sleep 1
          done
          echo "http-server never came up on :8080" && exit 1
      - run: npm run browserstack
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BUILD_NAME: stitches ${{ github.ref_name }} ${{ github.run_number }}
