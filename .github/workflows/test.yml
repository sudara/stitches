name: Tests

on: [push, pull_request]

jobs:
  # chromium uses the real Chrome channel for MP3 codecs; firefox bundles its
  # own. Both run on Linux.
  linux:
    name: Playwright (chromium + firefox) & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps firefox
      - run: npx playwright install --with-deps chrome
      - run: npx playwright test --project=chromium --project=firefox

  # WebKit only decodes MP3 on macOS (system codecs), so the Safari-engine lane
  # needs a macOS runner.
  webkit:
    name: Playwright (webkit, macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - run: npx playwright test --project=webkit
