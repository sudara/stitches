name: Tests

on: [push, pull_request]

jobs:
  # chromium uses the real Chrome channel for MP3 codecs. Required gate.
  chromium:
    name: Playwright (chromium) & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps chrome
      - run: npx playwright test --project=chromium

  # WebKit only decodes MP3 on macOS (system codecs), so the Safari-engine lane
  # needs a macOS runner. Required gate.
  webkit:
    name: Playwright (webkit, macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - run: npx playwright test --project=webkit

  # Non-blocking: the Player path has a known Firefox-on-Linux issue (the silent
  # unlock clip + 3-node pool contention cause spurious errors), tracked in
  # issue #159. Runs for visibility but does not gate the build.
  firefox:
    name: Playwright (firefox, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - run: npx playwright test --project=firefox
